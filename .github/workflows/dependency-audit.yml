name: Dependency audit

# Advisories are checked when the dependencies change, every day against the
# latest advisory database, and by the release before an installer is built.
# A finding is fixed by upgrading, not by ignoring it.
# A release checks what it ships: npm packages the installer contains (no dev-only build
# and test tools) and the Rust crates. Pull requests and the daily run check every npm
# package, dev tools included, so a dev-only finding is still reported and upgraded when a
# fix exists; it just does not block an installer it is not part of.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      npm-scope:
        description: "all: every npm package; shipped: only packages the installer contains"
        required: false
        type: string
        default: all
  schedule:
    - cron: '0 21 * * *'
  pull_request:
    paths:
      - 'apps/desktop/package-lock.json'
      - 'apps/desktop/host/Cargo.lock'
      - 'apps/desktop/src-tauri/Cargo.lock'
      - '.github/workflows/dependency-audit.yml'
permissions:
  contents: read
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.2'
      - name: npm audit
        env:
          NPM_SCOPE: ${{ inputs.npm-scope || 'all' }}
        run: |
          if [ "$NPM_SCOPE" = shipped ]; then
            npm audit --prefix apps/desktop --omit=dev --audit-level=high
          else
            npm audit --prefix apps/desktop --audit-level=high
          fi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v1
      - name: RustSec audit
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
          # The repository root has no Cargo.lock: each native crate keeps its own.
          for lock in apps/desktop/host/Cargo.lock apps/desktop/src-tauri/Cargo.lock; do
            cargo audit --file "$lock"
          done
